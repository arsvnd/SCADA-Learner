<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCADA & IIoT — Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Home screen -->
  <div class="screen active" id="screenHome">
    <div class="home-wrap">
      <div class="home-top">
        <div class="home-label">SCADA & IIoT Mastery</div>
        <h1 class="home-title">What are we<br>studying today?</h1>
        <div class="home-progress">
          <div class="hp-bar"><div class="hp-fill" id="homeBarFill"></div></div>
          <span class="hp-text" id="homeBarText">0 of 55 sessions done</span>
        </div>
      </div>
      <div class="module-list" id="moduleList"></div>
      <div class="home-footer">
        <button class="btn-ghost" id="homeSettingsBtn">⚙ API Key</button>
        <span class="streak-text" id="homeStreak"></span>
      </div>
    </div>
  </div>

  <!-- Study screen -->
  <div class="screen" id="screenStudy">
    <div class="study-wrap">
      <div class="study-left">
        <div class="study-nav">
          <button class="back-btn" id="backBtn">← Modules</button>
          <div class="study-breadcrumb" id="studyBreadcrumb"></div>
          <button class="btn-ghost small" id="studySettingsBtn">⚙</button>
        </div>
        <div class="day-tabs" id="dayTabs"></div>
        <div class="study-header">
          <div class="study-module-label" id="studyModuleLabel"></div>
          <h2 class="study-day-title" id="studyDayTitle"></h2>
          <div class="study-keywords" id="studyKeywords"></div>
        </div>
        <div class="study-body" id="studyBody">
          <div class="empty-state">
            <div class="empty-icon">◎</div>
            <p>Ready when you are.</p>
            <button class="btn-primary" id="loadBtn1">Generate today's notes</button>
          </div>
        </div>
        <div class="study-footer" id="studyFooter" style="display:none">
          <button class="btn-ghost" id="loadBtn">↻ Regenerate</button>
          <button class="btn-done" id="doneBtn">✓ Mark complete & continue</button>
        </div>
      </div>
      <div class="tutor-wrap" id="tutorWrap">
        <div class="tutor-head">
          <span class="tutor-label">Ask the tutor</span>
          <button class="tutor-close" id="tutorClose">✕</button>
        </div>
        <div class="chat-body" id="chatBody">
          <div class="chat-intro">Ask anything about this session — I'll tie it to your Rockwell &amp; panel wiring background.</div>
        </div>
        <div class="chat-foot">
          <div class="quick-qs" id="quickQs"></div>
          <div class="chat-row">
            <textarea id="chatInput" placeholder="Ask a question…" rows="2"></textarea>
            <button id="chatSend">↑</button>
          </div>
        </div>
      </div>
      <button class="tutor-toggle" id="tutorToggle">💬 Ask tutor</button>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-bg" id="modalBg">
    <div class="modal-box">
      <div class="modal-title">API Key <button class="modal-x" id="modalX">✕</button></div>
      <p class="modal-desc">Free at <a href="https://console.groq.com" target="_blank">console.groq.com</a> — no credit card needed. Key stays in your browser only.</p>
      <input type="password" id="apiInput" placeholder="gsk_…" autocomplete="off">
      <div class="modal-btns">
        <button class="btn-primary" id="saveKey">Save</button>
        <button class="btn-ghost" id="clearKey">Clear</button>
      </div>
      <div class="key-status" id="keyStatus"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
